name: self test

on:
  push:
  pull_request:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@0000000000000000000000000000000000000000 # TODO-PIN actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@0000000000000000000000000000000000000000 # TODO-PIN actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: raven-actions/actionlint@0000000000000000000000000000000000000000 # TODO-PIN raven-actions/actionlint@v2.0.1

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@0000000000000000000000000000000000000000 # TODO-PIN actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@0000000000000000000000000000000000000000 # TODO-PIN zizmorcore/zizmor-action@v0.2.0
        with:
          persona: pedantic
