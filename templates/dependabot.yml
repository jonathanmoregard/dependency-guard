version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      # Non-semver versions wait the longest window; the gate re-checks
      # every changed package's own publish age regardless.
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      cargo-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      # Non-semver versions wait the longest window; the gate re-checks
      # every changed package's own publish age regardless.
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      npm-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      # Actions are never auto-merged; a week gives compromised tags time
      # to be noticed before a human reviews the bump.
      default-days: 7
      semver-major-days: 14
    groups:
      actions-majors:
        patterns:
          - "*"
        update-types:
          - major
