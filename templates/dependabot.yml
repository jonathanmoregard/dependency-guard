version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      cargo-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      npm-majors:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      actions-majors:
        patterns:
          - "*"
        update-types:
          - major
